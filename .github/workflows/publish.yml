# Publish the rendered course site to GitHub Pages.
#
# Manually triggered (workflow_dispatch) on purpose: publishing is a
# deliberate act, not a side effect of every push. To activate, see
# docs/release-readiness.md. The site is rendered in CI with the same Quarto
# version tested locally; only the generated _site/ folder is deployed,
# never the repository root. No code cells execute at render time, and the
# verification scripts use only the Python standard library.
name: Publish site to GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: 1.10.18

      - name: Set up Python (standard library only; used by the checks)
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Render and run the complete verification suite
        run: bash scripts/verify.sh

      - name: Upload the rendered site as the Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
