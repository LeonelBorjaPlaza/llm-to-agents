project:
  type: website
  output-dir: _site
  render:
    - "*.qmd"
    - "learn/*.qmd"
    - "slides/*.qmd"
    - "!docs/"

website:
  title: "From LLMs to Agents"
  description: >-
    A conceptual course: what a large language model is, how it is built,
    and how it begins to act.
  navbar:
    left:
      - href: index.qmd
        text: Home
      - href: slides/llms-to-agents.qmd
        text: Slides
      - text: Learn
        menu:
          - href: learn/how-created.qmd
            text: From Text to Numbers
          - href: learn/neural-networks.qmd
            text: Neurons, Layers, and Learning
          - href: learn/why-transformers.qmd
            text: Why Transformers
          - href: learn/transformers-attention.qmd
            text: "Deep dive: How Self-Attention Moves Information"
          - href: learn/softmax-sampling.qmd
            text: Softmax, Sampling, and Temperature
          - href: learn/training.qmd
            text: How Pretraining Works
          - href: learn/tokens-context.qmd
            text: "Deep dive: Tokens, Embeddings, and the Context Window"
      - href: resources.qmd
        text: Resources

format:
  html:
    theme: cosmo
    css: assets/css/site.scss
    toc: true

execute:
  freeze: auto
