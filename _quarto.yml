project:
  type: website
  output-dir: _site
  render:
    - "*.qmd"
    - "learn/*.qmd"
    - "slides/*.qmd"
    - "!docs/"

website:
  title: "From LLMs to Agents"
  description: >-
    A conceptual course: what a large language model is, how it is built,
    and how it begins to act.
  navbar:
    left:
      - href: index.qmd
        text: Home
      - href: short-story.qmd
        text: The Short Story
      - text: Learn
        menu:
          - href: learn/how-created.qmd
            text: "1. From Text to Numbers"
          - href: learn/neural-networks.qmd
            text: "2. Neurons, Layers, and Learning"
          - href: learn/why-transformers.qmd
            text: "3. Why Transformers"
          - href: learn/training.qmd
            text: "4. How Pretraining Works"
          - href: learn/posttraining.qmd
            text: "5. Post-training"
          - href: learn/agents.qmd
            text: "6. From Assistant to Agent"
          - href: learn/using-models-well.qmd
            text: "7. Using Models Well"
      - text: Deep dives
        menu:
          - href: learn/tokens-context.qmd
            text: Tokens, Embeddings, and the Context Window
          - href: learn/transformers-attention.qmd
            text: How Self-Attention Moves Information
          - href: learn/softmax-sampling.qmd
            text: Softmax, Sampling, and Temperature
      - text: Reference
        menu:
          - href: milestones.qmd
            text: Milestones
          - href: glossary.qmd
            text: Glossary
          - href: resources.qmd
            text: Resources
          - href: sources.qmd
            text: Sources
          - href: slides/speaking-guide.qmd
            text: Speaking guide
      - href: slides/llms-to-agents.qmd
        text: Presentation

format:
  html:
    theme: [cosmo, assets/css/site.scss]
    toc: true
    include-after-body: _includes/_glossary-preview.html

filters:
  - filters/course-links.lua

execute:
  freeze: auto
